<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Team contacts | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="TEAM04-contacts" data-screen-title="TEAM-04 連絡係の指定">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <a href="TEAM01-setup.html" aria-label="Back to team setup" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">Team contacts</span>
  </header>
  <div style="padding: 14px 16px; background: #FFFFFF; border-bottom: 1px solid #EAECF0; font-size: 13px; line-height: 1.7; color: #344054">During the tournament, team contacts receive schedule changes and must tap <b>Got it</b> within <b>10 minutes</b> (5 for emergencies). Choose <b>2–3 people</b> so someone is always reachable.</div>
  <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 700">#1 [Player A]</span><button type="button" aria-label="Remove contact" style="min-width: 44px; min-height: 44px; border: none; background: transparent; color: #475467; font-size: 18px">×</button></div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="background: #ECFDF3; color: #05603A; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">✓ Logged in</span><span style="background: #ECFDF3; color: #05603A; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">✓ Alerts on</span><span style="background: #ECFDF3; color: #05603A; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">✓ Home screen</span></div>
    </section>
    <section style="background: #FFFFFF; border: 1.5px solid #F5C451; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 700">#4 [Player B]</span><button type="button" aria-label="Remove contact" style="min-width: 44px; min-height: 44px; border: none; background: transparent; color: #475467; font-size: 18px">×</button></div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap"><span style="background: #ECFDF3; color: #05603A; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">✓ Logged in</span><span style="background: #FEF0C7; color: #93370D; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">! Alerts off</span></div>
      <button type="button" style="align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1.5px solid #0B2545; background: #FFFFFF; color: #0B2545; font-family: inherit; font-size: 13px; font-weight: 700">Send setup reminder</button>
    </section>
    <button type="button" style="min-height: 56px; border-radius: 12px; border: 1.5px dashed #98A2B3; background: #FFFFFF; color: #0B2545; font-family: inherit; font-size: 15px; font-weight: 700">+ Choose from roster</button>
  </div>
</div>
</body>
</html>
