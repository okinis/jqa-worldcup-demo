<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-icon.png">
<title>会場掲示モード | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D0D5DD}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="P05-display" data-screen-title="P-05 会場掲示モード(大画面)">
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; background: #0B2545; color: #FFFFFF; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 40px; border-bottom: 1px solid #1E3A5F">
    <div style="display: flex; align-items: center; gap: 18px">
      <div style="width: 160px; height: 46px; border-radius: 8px; border: 1.5px dashed #98A2B3; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #D0D5DD">[大会ロゴ]</div>
      <span style="font-size: 26px; font-weight: 700">いま・次 <span style="font-weight: 500; color: #D0D5DD">Now &amp; Next</span></span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 52px; line-height: 1">14:12</span><span style="font-size: 18px; color: #D0D5DD">JST</span></div>
  </header>

  <div style="flex: 1; padding: 24px 40px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
    <div style="background: #FFFFFF; color: #101828; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 24px; font-weight: 700">ピッチ 1</span><span style="background: #0F766E; color: #FFFFFF; font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 999px">● LIVE</span></div>
      <div style="font-size: 26px; font-weight: 700; display: flex; justify-content: space-between"><span>JPN</span><span>GER</span></div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 96px; line-height: 0.9; text-align: center">60–40</div>
      <div style="margin-top: auto; border-top: 2px dashed #D0D5DD; padding-top: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #475467">次 Next</span><span style="font-size: 22px; font-weight: 700">USA – BEL</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; color: #93370D">14:40 (+10)</span></div>
    </div>
    <div style="background: #FFFFFF; color: #101828; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 24px; font-weight: 700">ピッチ 2</span><span style="background: #0F766E; color: #FFFFFF; font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 999px">● LIVE</span></div>
      <div style="font-size: 26px; font-weight: 700; display: flex; justify-content: space-between"><span>FRA</span><span>ESP</span></div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 96px; line-height: 0.9; text-align: center">30–30</div>
      <div style="margin-top: auto; border-top: 2px dashed #D0D5DD; padding-top: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #475467">次 Next</span><span style="font-size: 22px; font-weight: 700">AUS – NED</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; color: #93370D">14:45 (+15)</span></div>
    </div>
    <div style="background: #FFFFFF; color: #101828; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 24px; font-weight: 700">ピッチ 3</span><span style="background: #EAECF0; color: #344054; font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 999px">準備中</span></div>
      <div style="font-size: 26px; font-weight: 700; display: flex; justify-content: space-between"><span>USA</span><span>BEL</span></div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 72px; line-height: 1; text-align: center; color: #344054">14:20</div>
      <div style="margin-top: auto; border-top: 2px dashed #D0D5DD; padding-top: 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #475467">次 Next</span><span style="font-size: 22px; font-weight: 700">GBR – CAN</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">15:10</span></div>
    </div>
    <div style="background: #1E3A5F; color: #D0D5DD; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 24px; font-weight: 700; color: #FFFFFF">ピッチ 4</span>
      <span style="font-size: 20px">本日の試合は終了</span><span style="font-size: 18px">Finished for today</span>
    </div>
  </div>

  <footer style="display: flex; align-items: center; gap: 18px; background: #FEF0C7; color: #93370D; padding: 16px 40px; font-size: 22px; font-weight: 700">
    <span style="background: #93370D; color: #FFFFFF; font-size: 16px; padding: 4px 12px; border-radius: 6px">重要</span>
    <span>本日は暑さ休憩あり · Heat breaks in effect today</span>
    <span style="margin-left: auto; font-size: 15px; font-weight: 500; color: #344054">14:12 時点 · 自動更新</span>
  </footer>
</div>
</body>
</html>
