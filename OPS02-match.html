<body data-screen="OPS02-match" data-screen-title="OPS-02 試合の詳細・変更">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #101828; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <a href="OPS01-home.html" aria-label="運営ホームに戻る" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="background: #FEC84B; color: #101828; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px">運営</span>
    <span style="font-size: 16px; font-weight: 700">試合 #36</span>
    <span style="margin-left: auto; font-size: 12px; color: #D0D5DD">版 3</span>
  </header>
  <section style="background: #FFFFFF; border-bottom: 1px solid #D0D5DD; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 18px; font-weight: 700">AUS vs NED</div>
    <div style="display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 8px; font-size: 14px">
      <span style="color: #475467">予定</span><span>14:30 · ピッチ 2</span>
      <span style="color: #475467">現在</span><span style="font-weight: 700; color: #93370D">14:45 · ピッチ 2(+15分)</span>
      <span style="color: #475467">状態</span><span>予定</span>
    </div>
  </section>
  <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 56px; border-radius: 12px; border: 1.5px solid #98A2B3; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2545">時刻を変更</button>
      <button type="button" style="min-height: 56px; border-radius: 12px; border: 1.5px solid #98A2B3; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2545">ピッチを変更</button>
      <button type="button" style="min-height: 56px; border-radius: 12px; border: 1.5px solid #98A2B3; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2545">状態を変更</button>
      <button type="button" style="min-height: 56px; border-radius: 12px; border: 1.5px solid #98A2B3; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2545">担当を差し替え</button>
    </div>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; overflow: hidden">
      <div style="padding: 10px 14px; font-size: 13px; font-weight: 700; color: #475467; background: #F9FAFB">担当者</div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 10px 14px; border-top: 1px solid #EAECF0; font-size: 14px"><span>主審 · [氏名]</span><span style="color: #05603A; font-weight: 700; font-size: 12px">✓ 14:12 確認</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 10px 14px; border-top: 1px solid #EAECF0; font-size: 14px"><span>副審 · [氏名]</span><span style="color: #93370D; font-weight: 700; font-size: 12px">未確認 4分</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 10px 14px; border-top: 1px solid #EAECF0; font-size: 14px"><span>副審 · [氏名]</span><span style="color: #B42318; font-weight: 700; font-size: 12px">未チェックイン</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 10px 14px; border-top: 1px solid #EAECF0; font-size: 14px"><span>スコア係 · [氏名]</span><span style="color: #05603A; font-weight: 700; font-size: 12px">✓</span></div>
    </section>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
      <div style="font-weight: 700; color: #475467">変更履歴</div>
      <div>14:02 一括遅延 +15分(前の試合の延長)· 佐藤</div>
      <div style="color: #475467">4/28 日程を公開</div>
    </section>
  </div>
</div>
