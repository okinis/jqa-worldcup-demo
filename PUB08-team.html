<body data-screen="PUB08-team" data-screen-title="PUB-08 チーム詳細">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 14px">
    <a href="PUB07-teams.html" aria-label="参加チームに戻る" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="flex: none; width: 64px; height: 64px; border-radius: 12px; border: 1.5px dashed #98A2B3; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #D0D5DD">[ロゴ]</div>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; font-weight: 700">日本</span><span style="font-size: 12px; color: #D0D5DD">JPN · Pool B · 統括: 日本クアッドボール協会</span></div>
    </div>
    <button type="button" aria-pressed="true" style="min-height: 48px; border-radius: 12px; border: 1.5px solid #FFFFFF; background: #FFFFFF; color: #0B2545; font-family: inherit; font-size: 15px; font-weight: 700">フォロー中(通知を受け取る)</button>
  </header>
  <div role="tablist" aria-label="表示" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-bottom: 1px solid #D0D5DD">
    <button type="button" role="tab" aria-selected="false" style="min-height: 48px; border: none; border-bottom: 3px solid transparent; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #475467">試合</button>
    <button type="button" role="tab" aria-selected="true" style="min-height: 48px; border: none; border-bottom: 3px solid #0B2545; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2545">ロースター</button>
    <button type="button" role="tab" aria-selected="false" style="min-height: 48px; border: none; border-bottom: 3px solid transparent; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #475467">紹介</button>
  </div>
  <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 12px; font-weight: 700; color: #475467; padding: 0 4px">選手 18 · スタッフ 3</div>
    <div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; overflow: hidden">
      <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; padding: 10px 12px; font-size: 14px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #0B2545">1</span><span style="font-weight: 500">[選手名 A]</span><span style="font-size: 12px; color: #475467">主将</span></div>

      <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; padding: 10px 12px; font-size: 14px; border-top: 1px solid #EAECF0"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #0B2545">7</span><span style="font-weight: 500">[選手名 C]</span><span style="font-size: 12px; color: #475467"></span></div>
      <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; padding: 10px 12px; font-size: 14px; border-top: 1px solid #EAECF0"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #0B2545">10</span><span style="font-weight: 500">[選手名 D]</span><span style="font-size: 12px; color: #475467"></span></div>
      <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; padding: 10px 12px; font-size: 14px; border-top: 1px solid #EAECF0"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #0B2545">23</span><span style="font-weight: 500">[選手名 E]</span><span style="font-size: 12px; color: #475467"></span></div>
      <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; padding: 10px 12px; font-size: 14px; border-top: 1px solid #EAECF0; background: #F9FAFB"><span style="font-size: 12px; color: #475467">—</span><span style="font-weight: 500">[スタッフ名]</span><span style="font-size: 12px; color: #475467">コーチ</span></div>
    </div>
    <p style="margin: 4px 4px 0; font-size: 12px; color: #475467; line-height: 1.6">公開するのは名前・背番号・役割だけです。</p>
  </div>
</div>
