<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My duties | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="P02-duties" data-screen-title="P-02 自分の担当(審判)">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">My duties</span><span style="font-size: 11px; color: #D0D5DD">Referee · [Name]</span></div>
    <button type="button" aria-label="Change language (current: English)" style="min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #475467; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 13px">English ▾</button>
  </header>
  <div style="padding: 10px 16px; font-size: 12px; color: #344054; background: #FFFFFF; border-bottom: 1px solid #EAECF0">As of 14:12 JST</div>
  <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Change to confirm" style="background: #FEF0C7; border: 1.5px solid #F5C451; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="color: #93370D; font-size: 13px; font-weight: 700">Your duty moved · confirm within 8 min</div>
      <div style="font-size: 15px; font-weight: 700">Head referee · Match #36</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; display: flex; align-items: baseline; gap: 10px"><s style="font-size: 22px; color: #B54708">14:30</s><span style="color: #93370D">→</span><span style="font-size: 32px">14:45 JST</span></div>
      <button type="button" style="min-height: 56px; border-radius: 12px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Got it</button>
    </section>
    <section aria-label="Next duty" style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; font-weight: 700; color: #475467; letter-spacing: 0.06em">NEXT DUTY</div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 52px; line-height: 0.9; color: #0B2545">14:45</span><span style="font-size: 15px; font-weight: 700">Pitch 2</span></div>
      <div style="font-size: 16px; font-weight: 700">AUS vs NED · Head referee</div>
      <div style="background: #F5F7FA; border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; justify-content: space-between"><span style="color: #475467">Report by</span><span style="font-weight: 700">14:25 · Officials tent</span></div>
      <button type="button" style="min-height: 52px; border-radius: 12px; border: 2px solid #0F766E; background: #FFFFFF; color: #0F766E; font-family: inherit; font-size: 15px; font-weight: 700">Check in</button>
    </section>
    <section style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; font-weight: 700; color: #475467; padding: 0 4px">LATER TODAY</div>
      <div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; font-size: 14px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px">16:25</span><span>Assistant ref · #38</span><span style="color: #475467">Pitch 2</span></div>
      <div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; font-size: 14px"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px">17:30</span><span>Rest</span><span style="color: #475467">—</span></div>
    </section>
    <a href="STAFF03-all.html" style="font-size: 14px; font-weight: 500; padding: 0 4px">All my duties ›</a>
  </div>
</div>
</body>
</html>
