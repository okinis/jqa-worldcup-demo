<body data-screen="OPS07-changes" data-screen-title="OPS-07 変更履歴">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #101828; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <a href="OPS01-home.html" aria-label="運営ホームに戻る" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="background: #FEC84B; color: #101828; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px">運営</span>
    <span style="font-size: 16px; font-weight: 700">変更履歴</span>
    <span style="margin-left: auto; font-size: 12px; color: #D0D5DD">本日 14 件</span>
  </header>
  <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #475467"><span>14:05 · 田中(TD)</span><span style="background: #B42318; color: #FFFFFF; font-weight: 700; padding: 1px 7px; border-radius: 999px">緊急</span></div>
      <div style="font-size: 15px; font-weight: 700">全体中断(屋外の全ピッチ)</div>
      <div style="font-size: 13px; color: #344054">理由: 雷 · 通知 約 1,900 台 · 確認 22/24 チーム</div>
    </section>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #475467"><span>14:02 · 佐藤(ops)</span><span style="background: #FEF0C7; color: #93370D; font-weight: 700; padding: 1px 7px; border-radius: 999px">重要</span></div>
      <div style="font-size: 15px; font-weight: 700">一括遅延 ピッチ 2 · #36 以降 +15分</div>
      <div style="font-size: 13px; color: #344054">理由: 前の試合の延長 · 4 試合 · 衝突を承知で確定(1件)</div>
    </section>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #475467"><span>13:48 · 佐藤(ops)</span><span style="background: #FEF0C7; color: #93370D; font-weight: 700; padding: 1px 7px; border-radius: 999px">重要</span></div>
      <div style="font-size: 15px; font-weight: 700">#37 ピッチ 2 → ピッチ 4</div>
      <div style="font-size: 13px; color: #344054">理由: 施設(ゴールの破損)</div>
      <button type="button" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1.5px solid #B42318; background: #FFFFFF; color: #B42318; font-family: inherit; font-size: 13px; font-weight: 700">この変更を訂正する</button>
    </section>
    <section style="background: #F9FAFB; border: 1px dashed #98A2B3; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #475467"><span>13:20 · 佐藤(ops)</span><span>訂正</span></div>
      <div style="font-size: 15px; font-weight: 700">訂正: #33 の時刻変更を取り消し</div>
      <div style="font-size: 13px; color: #344054">理由: 誤りの訂正(違う試合を選んでいた)</div>
    </section>
  </div>
</div>
