<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-icon.png">
<title>Apply as referee or volunteer | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="STAFF01-apply" data-screen-title="STAFF-01 審判・ボランティアの応募">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 17px; font-weight: 700">Apply to help</span>
    <span style="font-size: 12px; color: #D0D5DD">Step 1 / 2</span>
  </header>
  <form style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px">
    <fieldset style="border: none; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">I want to help as</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="min-height: 48px; border: 2px solid #0B2545; background: #EEF2F6; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px; font-weight: 700"><input type="checkbox" checked style="width: 18px; height: 18px">Referee</label>
        <label style="min-height: 48px; border: 1.5px solid #D0D5DD; background: #FFFFFF; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px">Volunteer</label>
      </div>
    </fieldset>
    <fieldset style="border: none; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Days I can help</legend>
      <div style="display: grid; grid-template-columns: 56px repeat(2, minmax(0, 1fr)); gap: 6px; font-size: 13px; align-items: center">
        <span></span><span style="text-align: center; color: #475467">AM</span><span style="text-align: center; color: #475467">PM</span>
        <span style="font-weight: 700">Day 1</span><label style="min-height: 40px; border-radius: 8px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><input type="checkbox" checked aria-label="Day 1 morning" style="width: 18px; height: 18px"></label><label style="min-height: 40px; border-radius: 8px; background: #0B2545; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><input type="checkbox" checked aria-label="Day 1 afternoon" style="width: 18px; height: 18px"></label>
        <span style="font-weight: 700">Day 2</span><label style="min-height: 40px; border-radius: 8px; border: 1.5px solid #D0D5DD; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><input type="checkbox" aria-label="Day 2 morning" style="width: 18px; height: 18px"></label><label style="min-height: 40px; border-radius: 8px; background: #0B2545; display: flex; align-items: center; justify-content: center"><input type="checkbox" checked aria-label="Day 2 afternoon" style="width: 18px; height: 18px"></label>
        <span style="font-weight: 700">Day 3</span><label style="min-height: 40px; border-radius: 8px; background: #0B2545; display: flex; align-items: center; justify-content: center"><input type="checkbox" checked aria-label="Day 3 morning" style="width: 18px; height: 18px"></label><label style="min-height: 40px; border-radius: 8px; border: 1.5px solid #D0D5DD; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><input type="checkbox" aria-label="Day 3 afternoon" style="width: 18px; height: 18px"></label>
      </div>
    </fieldset>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">Languages I speak
      <input type="text" value="English, Deutsch" style="min-height: 48px; border-radius: 10px; border: 1.5px solid #98A2B3; padding: 0 12px; font-family: inherit; font-size: 15px; background: #FFFFFF">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">My team (to avoid conflicts of interest)
      <select style="min-height: 48px; border-radius: 10px; border: 1.5px solid #98A2B3; padding: 0 12px; font-family: inherit; font-size: 15px; background: #FFFFFF"><option>Germany</option></select>
    </label>
    <div style="background: #EEF2F6; border-radius: 12px; padding: 12px 14px; font-size: 12px; line-height: 1.7; color: #344054">We only ask what we need to assign duties. Next step: your referee certifications (type and expiry).</div>
  </form>
  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #D0D5DD">
    <button type="button" style="width: 100%; min-height: 52px; border-radius: 12px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">Next</button>
  </div>
</div>
</body>
</html>
