<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-icon.png">
<title>グッズの引き渡し | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="BOX02-pickup" data-screen-title="BOX-02 グッズの引き渡し">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #101828; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px"><span style="background: #FEC84B; color: #101828; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px">物販</span><span style="font-size: 15px; font-weight: 700">グッズの引き渡し</span></div>
    <span style="font-size: 12px; color: #D0D5DD">未受け取り 214 件</span>
  </header>
  <div style="height: 200px; background: #1D2939; display: flex; align-items: center; justify-content: center"><div style="width: 150px; height: 150px; border-radius: 16px; border: 3px solid #FFFFFF; box-sizing: border-box"></div></div>
  <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 700">注文 [注文番号]</span><span style="background: #ECFDF3; color: #05603A; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px">支払い済み</span></div>
    <div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; overflow: hidden">
      <label style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 60px; padding: 0 14px; font-size: 15px"><input type="checkbox" checked style="width: 22px; height: 22px"><span style="font-weight: 700">大会Tシャツ</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">M × 1</span></label>
      <label style="display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 60px; padding: 0 14px; font-size: 15px; border-top: 1px solid #EAECF0"><input type="checkbox" style="width: 22px; height: 22px"><span style="font-weight: 700">タオル</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px">× 2</span></label>
    </div>
    <p style="margin: 0; font-size: 13px; color: #344054; line-height: 1.6">渡したものにチェックを入れてから確定してください。一部だけ渡すこともできます。</p>
  </div>
  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #D0D5DD"><button type="button" style="width: 100%; min-height: 56px; border-radius: 12px; border: none; background: #0F766E; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">1 点を引き渡し済みにする</button></div>
</div>
</body>
</html>
