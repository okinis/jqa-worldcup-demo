<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>購入内容の確認 | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="BUY03-checkout" data-screen-title="BUY-03 購入内容の確認">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <a href="BUY01-tickets.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">購入内容の確認</span>
  </header>
  <form style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 4px 14px">
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EAECF0; font-size: 14px"><span>通し券(3日間) × 2</span><span style="font-weight: 700">¥[小計]</span></div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EAECF0; font-size: 14px"><span>大会Tシャツ M × 1</span><span style="font-weight: 700">¥[小計]</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; font-size: 15px; font-weight: 700"><span>合計(税込)</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px">¥[合計]</span></div>
    </section>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">メールアドレス<span style="font-size: 12px; font-weight: 400; color: #475467">チケットの QR と購入者ページのリンクを送ります</span>
      <input type="email" placeholder="you@example.com" style="min-height: 52px; border-radius: 12px; border: 1.5px solid #98A2B3; padding: 0 14px; font-family: inherit; font-size: 16px; background: #FFFFFF">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">お名前<span style="font-size: 12px; font-weight: 400; color: #475467">任意。領収書の宛名に使います</span>
      <input type="text" style="min-height: 52px; border-radius: 12px; border: 1.5px solid #98A2B3; padding: 0 14px; font-family: inherit; font-size: 16px; background: #FFFFFF">
    </label>
    <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.6; color: #344054; min-height: 44px"><input type="checkbox" style="width: 22px; height: 22px; margin-top: 1px; flex: none"><span><a href="#">利用規約</a>・<a href="#">払い戻しの規約</a>・<a href="#">特定商取引法に基づく表記</a>に同意します</span></label>
  </form>
  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #D0D5DD; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="min-height: 52px; border-radius: 12px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">支払いへ進む(Stripe)</button>
    <span style="font-size: 12px; color: #475467; text-align: center">カード情報は Stripe の画面で入力します。このサイトには保存しません。</span>
  </div>
</div>
</body>
</html>
