<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Roster change requests | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="TEAM05-requests" data-screen-title="TEAM-05 ロースター変更の申請">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <a href="TEAM01-setup.html" aria-label="Back to team setup" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">Roster changes</span>
  </header>
  <div style="padding: 12px 16px; background: #EEF2F6; font-size: 13px; line-height: 1.6; color: #344054">The roster deadline has passed. Changes now need approval by the Tournament Director.</div>
  <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <form style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <fieldset style="border: none; margin: 0; padding: 0">
        <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">New request</legend>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <label style="min-height: 44px; border: 2px solid #0B2545; background: #EEF2F6; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 700"><input type="radio" name="kind" checked>Replace</label>
          <label style="min-height: 44px; border: 1.5px solid #D0D5DD; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px"><input type="radio" name="kind">Add</label>
          <label style="min-height: 44px; border: 1.5px solid #D0D5DD; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px"><input type="radio" name="kind">Number</label>
        </div>
      </fieldset>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Out<select style="min-height: 44px; border-radius: 10px; border: 1.5px solid #98A2B3; padding: 0 10px; font-family: inherit; font-size: 14px; background: #FFFFFF"><option>#23 [Player E]</option></select></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">In<input type="text" value="[New player name] · #31" style="min-height: 44px; border-radius: 10px; border: 1.5px solid #98A2B3; padding: 0 10px; font-family: inherit; font-size: 14px"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Reason<select style="min-height: 44px; border-radius: 10px; border: 1.5px solid #98A2B3; padding: 0 10px; font-family: inherit; font-size: 14px; background: #FFFFFF"><option>Injury</option></select></label>
      <button type="button" style="min-height: 48px; border-radius: 12px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">Send request</button>
    </form>
    <div style="font-size: 12px; font-weight: 700; color: #475467; padding: 0 4px">HISTORY</div>
    <div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px"><span>Number #12 → #21</span><span style="background: #ECFDF3; color: #05603A; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">Approved</span></div>
    <div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px"><span>Add [Player F]</span><span style="background: #FEF0C7; color: #93370D; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px">Pending</span></div>
  </div>
</div>
</body>
</html>
