<body data-screen="AUTH02-sent" data-screen-title="AUTH-02 メール送信済み">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
    <a href="AUTH01-login.html" aria-label="Back to log in" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">Log in</span>
  </header>
  <main style="flex: 1; padding: 48px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
    <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><rect x="8" y="16" width="56" height="40" rx="6" fill="none" stroke="#0B2545" stroke-width="3"></rect><path d="M10 20l26 20 26-20" fill="none" stroke="#0B2545" stroke-width="3"></path></svg>
    <h1 style="margin: 0; font-size: 24px">Check your email</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #344054">We sent a login link to<br><b style="color: #101828">contact@example.org</b><br>Open the link on this phone. It expires in 24 hours.</p>
    <div style="width: 100%; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 14px; text-align: left; font-size: 13px; line-height: 1.7; color: #344054">
      <b style="color: #101828">Didn't get it?</b><br>Check your spam or junk folder. The email comes from [送信元アドレス].
    </div>
    <button type="button" disabled style="width: 100%; min-height: 52px; border-radius: 12px; border: 1.5px solid #D0D5DD; background: #FFFFFF; color: #475467; font-family: inherit; font-size: 15px; font-weight: 700">Resend in 0:48</button>
  </main>
</div>
</body>
