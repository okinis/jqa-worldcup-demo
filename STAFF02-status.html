<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Application status | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="STAFF02-status" data-screen-title="STAFF-02 応募の状況">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 17px; font-weight: 700">My application</span>
  </header>
  <main style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <ol aria-label="Progress" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0">
      <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding-bottom: 18px"><span style="width: 28px; height: 28px; border-radius: 50%; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.2l2.8 2.8 6.2-6.5" fill="none" stroke="currentColor" stroke-width="2"></path></svg></span><div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Applied</span><span style="font-size: 12px; color: #475467">Referee · 2028-12-28</span></div></li>
      <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding-bottom: 18px"><span style="width: 28px; height: 28px; border-radius: 50%; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.2l2.8 2.8 6.2-6.5" fill="none" stroke="currentColor" stroke-width="2"></path></svg></span><div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Approved</span><span style="font-size: 12px; color: #475467">Certification checked</span></div></li>
      <li style="display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px"><span style="width: 28px; height: 28px; border-radius: 50%; border: 3px solid #0B2545; box-sizing: border-box; background: #FFFFFF"></span><div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Confirmed</span><span style="font-size: 12px; color: #475467">Waiting for the final roster of officials (by [日付])</span></div></li>
    </ol>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 4px 14px">
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EAECF0; font-size: 14px"><span style="color: #475467">Role</span><span style="font-weight: 700">Referee</span></div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EAECF0; font-size: 14px"><span style="color: #475467">Days</span><span style="font-weight: 700">Day 1 · Day 2 PM · Day 3 AM</span></div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px"><span style="color: #475467">Certification</span><span style="font-weight: 700">[資格の種類] · until 2030-01</span></div>
    </section>
    <a href="#" style="min-height: 48px; border-radius: 12px; border: 1.5px solid #98A2B3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none">Edit availability</a>
    <a href="#" style="font-size: 14px; color: #B42318; text-align: center">Withdraw my application</a>
  </main>
</div>
</body>
</html>
