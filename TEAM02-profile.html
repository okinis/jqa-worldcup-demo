<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-icon.png">
<title>Team profile | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="TEAM02-profile" data-screen-title="TEAM-02 チームプロフィール">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <a href="TEAM01-setup.html" aria-label="Back to team setup" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">Team profile</span>
  </header>
  <form style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 88px; height: 88px; border-radius: 14px; border: 1.5px dashed #98A2B3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #475467">[Logo]</div>
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #98A2B3; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0B2545">Upload logo</button>
    </div>
    <fieldset style="border: none; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Jersey colors</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="min-height: 52px; border: 1.5px solid #D0D5DD; background: #FFFFFF; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px"><span style="width: 28px; height: 28px; border-radius: 6px; background: #101828"></span>Primary<input type="color" value="#101828" aria-label="Primary color" style="width: 0; height: 0; opacity: 0"></label>
        <label style="min-height: 52px; border: 1.5px solid #D0D5DD; background: #FFFFFF; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px"><span style="width: 28px; height: 28px; border-radius: 6px; background: #D92D20"></span>Secondary<input type="color" value="#D92D20" aria-label="Secondary color" style="width: 0; height: 0; opacity: 0"></label>
      </div>
    </fieldset>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center"><label for="intro-en" style="font-size: 14px; font-weight: 700">Team introduction</label><span role="tablist" aria-label="Language" style="display: flex; gap: 4px"><button type="button" role="tab" aria-selected="true" style="min-height: 32px; padding: 0 10px; border-radius: 6px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 700">EN</button><button type="button" role="tab" aria-selected="false" style="min-height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 12px">日本語</button></span></div>
      <textarea id="intro-en" rows="6" style="border-radius: 10px; border: 1.5px solid #98A2B3; padding: 12px; font-family: inherit; font-size: 15px; line-height: 1.6; resize: none; background: #FFFFFF">[Team introduction in English]</textarea>
      <span style="font-size: 12px; color: #475467">Japanese and other languages are auto-translated unless you write them.</span>
    </div>
  </form>
  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #D0D5DD"><button type="button" style="width: 100%; min-height: 52px; border-radius: 12px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">Save</button></div>
</div>
</body>
</html>
