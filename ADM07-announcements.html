    <div style="display: flex; align-items: center; gap: 12px"><span style="background: #FEC84B; color: #101828; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px">管理</span><span style="font-size: 16px; font-weight: 700">[大会名] 管理画面</span></div>
    <span style="font-size: 13px; color: #D0D5DD">[氏名] · editor</span>
  </header>
  <div style="flex: 1; display: flex; flex-wrap: wrap">
    <nav aria-label="管理メニュー" style="flex: 1 1 220px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #D0D5DD; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 13px">

    <main style="flex: 999 1 560px; min-width: 0; padding: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0 0 4px; font-size: 24px">お知らせ</h1>
        <div style="background: #FFFFFF; border: 2px solid #0B2545; border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 2px"><span style="color: #93370D; font-weight: 700">重要 · 編集中</span><span style="font-weight: 700">シャトルバスの運行計画</span><span style="color: #475467">予約: 4/28 10:00</span></div>
        <div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 2px"><span style="color: #475467">通常 · 公開中</span><span style="font-weight: 700">チケット販売開始のお知らせ</span></div>
        <div style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 2px"><span style="color: #475467">全チーム宛て · 確認 18/24</span><span style="font-weight: 700">ロースター締切の案内</span></div>
      </section>
      <form style="flex: 2 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">重要度<select style="min-height: 40px; border-radius: 8px; border: 1.5px solid #98A2B3; font-family: inherit"><option>重要</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">宛先<select style="min-height: 40px; border-radius: 8px; border: 1.5px solid #98A2B3; font-family: inherit"><option>全員</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">公開<input type="datetime-local" style="min-height: 40px; border-radius: 8px; border: 1.5px solid #98A2B3; font-family: inherit"></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">有効期限<input type="datetime-local" style="min-height: 40px; border-radius: 8px; border: 1.5px solid #98A2B3; font-family: inherit"></label>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" style="width: 18px; height: 18px">チームの連絡係に「確認しました」を求める</label>
        <div role="tablist" aria-label="言語" style="display: flex; gap: 6px"><button type="button" role="tab" aria-selected="true" style="min-height: 34px; padding: 0 12px; border-radius: 6px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 12px">English(基準)</button><button type="button" role="tab" aria-selected="false" style="min-height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 12px">日本語</button><button type="button" role="tab" aria-selected="false" style="min-height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 12px">他 4 言語(自動翻訳)</button></div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">タイトル<input type="text" value="Shuttle bus plan" style="min-height: 40px; border-radius: 8px; border: 1.5px solid #98A2B3; padding: 0 10px; font-family: inherit; font-size: 14px"></label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">本文<textarea rows="6" style="border-radius: 8px; border: 1.5px solid #98A2B3; padding: 10px; font-family: inherit; font-size: 14px; resize: vertical">[本文]</textarea></label>
        <div style="display: flex; justify-content: flex-end; gap: 8px"><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1.5px solid #98A2B3; background: #FFFFFF; font-family: inherit; font-weight: 700; color: #0B2545">下書き保存</button><button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-weight: 700">予約する</button></div>
      </form>
