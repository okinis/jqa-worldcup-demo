<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-icon.png">
<title>全体中断・再開・避難 | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="OPS04-emergency" data-screen-title="OPS-04 全体中断・再開・避難">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #101828; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <a href="OPS01-home.html" aria-label="運営ホームに戻る" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="background: #FEC84B; color: #101828; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px">運営</span>
    <span style="font-size: 16px; font-weight: 700">全体中断</span>
  </header>
  <div style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
    <fieldset style="border: none; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">理由</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="min-height: 52px; border: 2.5px solid #B42318; background: #FEE4E2; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; font-weight: 700"><input type="radio" name="r" checked style="width: 18px; height: 18px">雷</label>
        <label style="min-height: 52px; border: 1.5px solid #D0D5DD; background: #FFFFFF; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px"><input type="radio" name="r" style="width: 18px; height: 18px">暑さ</label>
        <label style="min-height: 52px; border: 1.5px solid #D0D5DD; background: #FFFFFF; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px"><input type="radio" name="r" style="width: 18px; height: 18px">豪雨</label>
        <label style="min-height: 52px; border: 1.5px solid #D0D5DD; background: #FFFFFF; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px"><input type="radio" name="r" style="width: 18px; height: 18px">地震・避難</label>
      </div>
    </fieldset>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700">対象
      <select style="min-height: 48px; border-radius: 10px; border: 1.5px solid #98A2B3; padding: 0 12px; font-family: inherit; font-size: 15px; background: #FFFFFF"><option>屋外の全ピッチ(屋内は継続)</option></select>
    </label>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 700">送る定型文</span><span style="color: #05603A; font-weight: 700">全 6 言語 確認済み</span></div>
      <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #344054">雷のため屋外の全試合を中断します。ピッチから離れ、本館または全天候型練習場へ移動してください。</p>
    </section>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 700">放送用原稿(確定後に表示)</div>
      <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #475467">日本語 → English の順に読み上げ</p>
    </section>
    <p style="margin: 0; font-size: 12px; color: #475467; line-height: 1.6">確定すると全員に緊急通知を送り、試合中のピッチのスコア係に中断の記録を求めます。</p>
  </div>
  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #D0D5DD">
    <button type="button" style="width: 100%; min-height: 64px; border-radius: 14px; border: none; background: #B42318; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">長押しで全体中断を確定<span style="font-size: 12px; font-weight: 500">2 秒間押し続けてください</span></button>
  </div>
</div>
</body>
</html>
