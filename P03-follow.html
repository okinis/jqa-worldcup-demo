<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>通知の設定 | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="P03-follow" data-screen-title="P-03 通知の設定">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <a href="PUB01-top.html" aria-label="トップに戻る" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #475467; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="2"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">通知の設定</span>
  </header>
  <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px">
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; font-weight: 700; color: #475467">1. ホーム画面に追加(iPhone は必須)</div>
      <ol style="margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.8">
        <li>Safari の共有ボタン <svg width="14" height="14" viewBox="0 0 14 14" aria-label="共有" style="vertical-align: -2px"><path d="M7 1v8M4 4l3-3 3 3M2.5 7v5.5h9V7" fill="none" stroke="#0B2545" stroke-width="1.4"></path></svg> を押す</li>
        <li>「ホーム画面に追加」を選ぶ</li>
        <li>ホーム画面のアイコンから開き直す</li>
      </ol>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #05603A; font-weight: 700"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.2l2.8 2.8 6.2-6.5" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg>ホーム画面から開いています</div>
    </section>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; font-weight: 700; color: #475467">2. 通知を許可</div>
      <button type="button" style="min-height: 52px; border-radius: 12px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">通知を許可する</button>
    </section>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; font-weight: 700; color: #475467">3. フォローするチーム</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #0B2545; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">✓ 日本</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px">ドイツ</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D0D5DD; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px">フランス</button>
        <button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px dashed #98A2B3; background: #FFFFFF; color: #344054; font-family: inherit; font-size: 13px">+ ほかのチーム</button>
      </div>
      <p style="margin: 0; font-size: 12px; color: #475467; line-height: 1.6">フォロー中のチームの試合が15分以上動いたとき・ピッチが変わったとき・対戦が決まったときに通知します。緊急のお知らせは全員に届きます。</p>
    </section>
    <section style="background: #FFFFFF; border: 1px solid #D0D5DD; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: space-between">
      <label for="lang" style="font-size: 14px; font-weight: 700">通知の言語</label>
      <select id="lang" style="min-height: 44px; border-radius: 10px; border: 1.5px solid #D0D5DD; padding: 0 10px; font-family: inherit; font-size: 14px; background: #FFFFFF"><option>日本語</option></select>
    </section>
    <p style="margin: 0 4px; font-size: 12px; color: #475467">ログインは不要です。メールアドレスも聞きません。</p>
  </div>
</div>
</body>
</html>
