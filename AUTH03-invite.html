<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Team invitation | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="AUTH03-invite" data-screen-title="AUTH-03 招待の受け取り">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #0B2545; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="width: 120px; height: 34px; border-radius: 6px; border: 1.5px dashed #98A2B3; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #D0D5DD">[LOGO]</div>
    <button type="button" aria-label="Change language (current: Deutsch)" style="min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #475467; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 13px">English ▾</button>
  </header>
  <main style="flex: 1; padding: 28px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700; color: #475467">INVITATION</span>
      <h1 style="margin: 0; font-size: 24px; line-height: 1.35">Your team manager added you to Team Germany</h1>
    </div>
    <section aria-label="Your roster entry" style="background: #FFFFFF; border: 2px solid #0B2545; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 16px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 52px; line-height: 1; color: #0B2545">7</span>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">[Player name]</span><span style="font-size: 13px; color: #475467">Player · Team Germany</span></div>
    </section>
    <ul style="margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.8; color: #344054">
      <li>See your team's next match and team-only news</li>
      <li>Get alerts when your match moves</li>
    </ul>
    <div style="background: #EEF2F6; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.7; color: #344054">We only store your email address. Your name and number are managed by your team manager.</div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="min-height: 52px; border-radius: 12px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">This is me — continue</button>
      <a href="#" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px">This isn't me</a>
    </div>
  </main>
</div>
</body>
</html>
