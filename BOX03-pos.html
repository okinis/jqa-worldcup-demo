<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-icon.png">
<title>当日販売 | W杯運営システム デモ</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B2545}a:hover{color:#101828}
</style>
<link rel="stylesheet" href="assets/demo.css?v=daa5579b">
<script src="assets/demo.js?v=daa5579b" defer></script>
</head>
<body data-screen="BOX03-pos" data-screen-title="BOX-03 当日販売(案。Q-17)">
<div style="width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F5F7FA; color: #101828; font-family: 'IBM Plex Sans JP', sans-serif; display: flex; flex-direction: column">
  <header style="background: #101828; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px"><span style="background: #FEC84B; color: #101828; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px">物販</span><span style="font-size: 15px; font-weight: 700">当日販売</span></div>
    <span style="font-size: 11px; color: #D0D5DD">案(Q-17 決定待ち)</span>
  </header>
  <div style="flex: 1; padding: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start">
    <button type="button" style="min-height: 92px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; text-align: left"><span style="font-size: 15px; font-weight: 700">Tシャツ S</span><span style="font-size: 12px; color: #475467">在庫 18</span></button>
    <button type="button" style="min-height: 92px; border-radius: 12px; border: 2px solid #0B2545; background: #EEF2F6; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; text-align: left"><span style="font-size: 15px; font-weight: 700">Tシャツ M</span><span style="font-size: 12px; color: #475467">在庫 31 · カート 1</span></button>
    <button type="button" style="min-height: 92px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; text-align: left"><span style="font-size: 15px; font-weight: 700">Tシャツ L</span><span style="font-size: 12px; color: #475467">在庫 24</span></button>
    <button type="button" style="min-height: 92px; border-radius: 12px; border: 2px solid #0B2545; background: #EEF2F6; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; text-align: left"><span style="font-size: 15px; font-weight: 700">タオル</span><span style="font-size: 12px; color: #475467">在庫 40 · カート 2</span></button>
    <button type="button" style="min-height: 92px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; text-align: left"><span style="font-size: 15px; font-weight: 700">ピンバッジ</span><span style="font-size: 12px; color: #B42318; font-weight: 700">在庫 3</span></button>
    <button type="button" disabled style="min-height: 92px; border-radius: 12px; border: 1px solid #EAECF0; background: #F9FAFB; font-family: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; text-align: left; color: #475467"><span style="font-size: 15px; font-weight: 700">記念ジャージ</span><span style="font-size: 12px">売り切れ</span></button>
    <p style="grid-column: 1 / -1; margin: 4px 2px 0; font-size: 12px; color: #475467; line-height: 1.6">在庫は事前販売と共通。会場受け取り分は確保済みのため、ここでは売れません。</p>
  </div>
  <div style="padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #D0D5DD; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px">3 点</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px">¥[合計]</span></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 52px; border-radius: 12px; border: 1.5px solid #98A2B3; background: #FFFFFF; color: #0B2545; font-family: inherit; font-size: 15px; font-weight: 700">現金</button>
      <button type="button" style="min-height: 52px; border-radius: 12px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">カード(端末)</button>
    </div>
  </div>
</div>
</body>
</html>
